name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tooling/eslint/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Quality checks
        run: npm run check

      - name: Build Cloudflare Worker
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opennext-worker
          include-hidden-files: true
          path: |
            .open-next/
            !.open-next/cache/**
            !.open-next/**/*.map
            !.open-next/**/.env*
            !.open-next/**/.dev.vars*
          retention-days: 7
