name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            tooling/eslint/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build legacy Vue client
        run: npm run build:vue

      - name: Build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY || '0x4AAAAAAD6gcShUkr9NZuAJ' }}
          VITE_REQUIRE_EMAIL_CODE: 'true'
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opennext-worker
          include-hidden-files: true
          path: |
            .open-next/
            !.open-next/cache/**
            !.open-next/**/*.map
            !.open-next/**/.env*
            !.open-next/**/.dev.vars*
          retention-days: 7
